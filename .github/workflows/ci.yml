name: RentSpace CI

# ========================================================
# Trigger: Push lên mọi nhánh hoặc tạo PR vào main/develop
# ========================================================
on:
  push:
    branches: ["**"]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/**'
      - 'docker-compose*.yml'
      - 'nginx/**'
  pull_request:
    branches: [main, develop]
    # PR luôn chạy đầy đủ — không filter path

# Quyền tối thiểu (Least Privilege) — Chỉ mở rộng khi cần
permissions:
  contents: read
  security-events: write  # Cần cho Trivy upload SARIF report

# Hủy run cũ nếu có run mới trên cùng branch (tránh lãng phí runner)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================================
  # JOB 1: SECURITY SCAN
  # Quét lỗ hổng bảo mật mã nguồn và dependencies với Trivy
  # ==========================================================
  security-scan:
    name: 🔐 Security Scan (Trivy)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      # --- Quét toàn bộ filesystem (source code + lock files) ---
      - name: Run Trivy vulnerability scanner (filesystem)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          scanners: "vuln,secret,misconfig"   # Quét cả secret bị hardcode
          severity: "CRITICAL,HIGH"           # Chỉ fail khi có lỗ hổng nghiêm trọng
          format: "sarif"
          output: "trivy-results.sarif"
          exit-code: "0"                      # Không fail job — report kết quả để review
        env:
          # Bỏ qua các thư mục không cần thiết để tăng tốc
          TRIVY_SKIP_DIRS: "frontend/node_modules,.git,backend/target"

      # --- Upload kết quả lên GitHub Security tab ---
      # Lưu ý: Tính năng này yêu cầu GitHub Advanced Security
      # (miễn phí với public repo, cần trả phí với private repo)
      # continue-on-error: true để pipeline không crash trên Free plan
      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()  # Upload dù scan fail hay pass
        continue-on-error: true  # Không fail job nếu repo private + Free plan
        with:
          sarif_file: "trivy-results.sarif"
          category: "trivy-fs-scan"

      # --- Scan riêng: Kiểm tra secrets bị lộ (fail ngay nếu tìm thấy) ---
      - name: Trivy secret scan (fail on detect)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          scanners: "secret"
          severity: "LOW,MEDIUM,HIGH,CRITICAL"
          exit-code: "1"                      # Fail ngay nếu tìm thấy secret
          format: "table"
        env:
          TRIVY_SKIP_DIRS: "frontend/node_modules,.git,backend/target"

  # ==========================================================
  # JOB 2: BACKEND — BUILD & TEST
  # Spring Boot 3.3.5 / Java 17 / Maven
  # ==========================================================
  build-backend:
    name: ☕ Backend — Build & Test (Java 17 / Spring Boot)
    runs-on: ubuntu-latest
    needs: security-scan    # Chỉ chạy sau khi security scan pass

    # Service containers chạy song song với job
    services:
      # PostgreSQL + PostGIS (bắt buộc cho integration tests)
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: rentspace_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_password_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # Redis (cho tests liên quan đến cache/session)
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      # Cache Maven dependencies — Tăng tốc build đáng kể
      - name: Set up JDK 17 (Temurin) with Maven cache
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"

      # Gộp compile + test + package vào 1 lệnh để tránh biên dịch 2 lần
      - name: Build, Test & Package
        run: ./mvnw clean package -B
        working-directory: ./backend
        env:
          # Database — trỏ vào service container
          DB_URL: jdbc:postgresql://localhost:5432/rentspace_test
          DB_USERNAME: postgres
          DB_PASSWORD: ci_password_only
          # Redis
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          # JWT — Dùng secret fake cho CI (không phải production key)
          JWT_SECRET: ci_test_secret_key_min_256bit_do_not_use_in_production_xxxxxxxxxxx
          # AWS — Dùng giá trị fake để Spring context load được
          AWS_ACCESS_KEY: ci-fake-access-key
          AWS_SECRET_KEY: ci-fake-secret-key
          AWS_S3_BUCKET: ci-fake-bucket
          AWS_REGION: ap-southeast-1
          # Mail — Disable SMTP thực tế trong CI
          MAIL_USERNAME: ci@example.com
          MAIL_PASSWORD: ci-fake-password
          MAIL_HOST: localhost
          MAIL_PORT: 25
          # Frontend URL
          FRONTEND_URL: http://localhost:3000
          # Tắt telemetry để giảm noise trong log
          SPRING_PROFILES_ACTIVE: test

      # Upload test report để debug khi fail
      - name: Upload Surefire Test Reports
        uses: actions/upload-artifact@v4
        if: failure()   # Chỉ upload khi test fail — tiết kiệm storage
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/
          retention-days: 7

      # Upload JAR artifact cho potential deployment
      - name: Upload Backend JAR
        uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && success()
        with:
          name: backend-jar-${{ github.sha }}
          path: backend/target/*.jar
          retention-days: 14

  # ==========================================================
  # JOB 3: FRONTEND — LINT, TYPE CHECK & BUILD
  # Next.js 16 / React 19 / TypeScript / TailwindCSS v4
  # ==========================================================
  build-frontend:
    name: ⚛️ Frontend — Lint, TypeCheck & Build (Next.js 16)
    runs-on: ubuntu-latest
    needs: security-scan    # Chỉ chạy sau khi security scan pass

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      # Setup Node với npm cache — Dùng .npmrc và package-lock.json
      - name: Set up Node.js 20 with npm cache
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # npm ci — Faster, reproducible install cho CI
      - name: Install dependencies (npm ci)
        run: npm ci
        working-directory: ./frontend

      # TypeScript type checking riêng (không build)
      - name: TypeScript type check
        run: npx tsc --noEmit
        working-directory: ./frontend

      # ESLint
      - name: Run ESLint
        run: npm run lint
        working-directory: ./frontend

      # Build production bundle — Xác nhận không có lỗi compile
      - name: Build Next.js production bundle
        run: npm run build
        working-directory: ./frontend
        env:
          # Giá trị placeholder để build pass (không cần API thật)
          NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
          NEXTAUTH_SECRET: ci_nextauth_secret_placeholder_not_for_production
          NEXTAUTH_URL: http://localhost:3000
          NEXT_PUBLIC_MAPBOX_TOKEN: pk.ci_fake_mapbox_token_for_build_only
          GOOGLE_CLIENT_ID: ci_fake_google_client_id
          GOOGLE_CLIENT_SECRET: ci_fake_google_client_secret
          NEXT_TELEMETRY_DISABLED: 1  # Tắt Next.js telemetry

      # Cache .next/cache để tăng tốc build lần sau
      - name: Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: frontend/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}-${{ hashFiles('frontend/src/**') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}-

  # ==========================================================
  # JOB 4: CI SUMMARY — Tổng hợp kết quả
  # ==========================================================
  ci-summary:
    name: ✅ CI Summary
    runs-on: ubuntu-latest
    needs: [security-scan, build-backend, build-frontend]
    if: always()  # Luôn chạy để báo cáo kết quả

    steps:
      - name: Check all jobs status
        run: |
          echo "=========================================="
          echo "  RentSpace CI Pipeline — Summary"
          echo "=========================================="
          echo "🔐 Security Scan : ${{ needs.security-scan.result }}"
          echo "☕ Backend Build : ${{ needs.build-backend.result }}"
          echo "⚛️ Frontend Build: ${{ needs.build-frontend.result }}"
          echo "------------------------------------------"

          # Fail nếu bất kỳ job nào bị fail
          if [[ "${{ needs.security-scan.result }}" == "failure" ||
                "${{ needs.build-backend.result }}" == "failure" ||
                "${{ needs.build-frontend.result }}" == "failure" ]]; then
            echo "❌ CI FAILED — Kiểm tra logs của job bị lỗi bên trên."
            exit 1
          fi

          echo "✅ CI PASSED — Tất cả checks đã pass!"
