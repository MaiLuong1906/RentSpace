name: RentSpace CD — Deploy to Production

# ================================================================
# Chỉ trigger khi có push (merge) vào nhánh main.
# Lúc này ci.yml đã chạy và pass trên PR rồi — không cần test lại.
# ================================================================
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker-compose.prod.yml'
      - 'nginx/**'
      - '.github/workflows/ci-cd.yml'

# Quyền tối thiểu
permissions:
  contents: read

# Nếu có deploy đang chạy mà có deploy mới → hủy cái cũ
concurrency:
  group: production-deploy
  cancel-in-progress: false  # KHÔNG hủy deploy đang chạy — tránh broken state

jobs:
  # ================================================================
  # JOB: DEPLOY TO PRODUCTION
  # Chỉ chạy sau khi PR đã được merge vào main (ci.yml đã pass)
  # ================================================================
  deploy:
    name: 🚀 Deploy to Production (VPS)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      # Hiển thị thông tin deploy để dễ trace log
      - name: Print deploy info
        run: |
          echo "================================================"
          echo "  🚀 RentSpace — Deploying to Production"
          echo "================================================"
          echo "Branch  : ${{ github.ref_name }}"
          echo "Commit  : ${{ github.sha }}"
          echo "Author  : ${{ github.actor }}"
          echo "Message : ${{ github.event.head_commit.message }}"
          echo "================================================"

      # SSH vào VPS và thực hiện deploy với Docker Compose
      - name: Deploy via SSH to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e

            echo "📦 Pulling latest code..."
            cd /opt/rentspace
            git pull origin main

            echo "🐳 Pulling updated Docker images..."
            docker compose -f docker-compose.prod.yml pull

            echo "🔄 Restarting services with zero-downtime..."
            docker compose -f docker-compose.prod.yml up -d --build --remove-orphans

            echo "🧹 Cleaning up unused Docker resources..."
            docker system prune -f

            echo "✅ Deploy completed successfully!"
            echo "Services status:"
            docker compose -f docker-compose.prod.yml ps

      # Verify các service thực sự up sau khi deploy
      - name: Health check — Verify services are running
        run: |
          echo "🏊 Running post-deploy health checks..."
          sleep 20  # Chờ service khởi động

          # Kiểm tra Backend (Spring Boot Actuator)
          echo "Checking backend health..."
          curl --fail --silent --max-time 10 \
            https://${{ secrets.VPS_HOST }}/api/actuator/health \
            | grep -q '"status":"UP"' \
            && echo "✅ Backend is healthy" \
            || (echo "❌ Backend health check FAILED" && exit 1)

          # Kiểm tra Frontend (Next.js)
          echo "Checking frontend health..."
          curl --fail --silent --max-time 10 \
            https://${{ secrets.VPS_HOST }} \
            -o /dev/null -w "%{http_code}" \
            | grep -q "200" \
            && echo "✅ Frontend is healthy" \
            || (echo "❌ Frontend health check FAILED" && exit 1)

          echo "🎉 All services are healthy — Deploy successful!"
